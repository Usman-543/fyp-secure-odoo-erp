[options]
# Server Settings
http_port = 8069
db_host = postgres
db_port = 5432
db_user = odoo
db_password = SecureOdooPass2025!

# Security Settings
admin_passwd = MasterPassword2025!
list_db = False
dbfilter = ^Production$

# Proxy Mode (Required for Nginx)
proxy_mode = True

# Logging
log_level = info

# Performance
workers = 0

# Paths
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
